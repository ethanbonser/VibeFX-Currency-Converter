<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0d17" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" stroke="#6366f1" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Decorative Orbit Ring -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#a855f7" stroke-width="4" stroke-dasharray="8 12" opacity="0.45"/>

  <!-- Glowing Neon Conversion Arrows -->
  <!-- Top Arc (Cyan) -->
  <path d="M 140 220 A 130 130 0 0 1 370 200" fill="none" stroke="url(#neonCyan)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="360,170 395,205 350,230" fill="url(#neonCyan)" filter="url(#glow)"/>

  <!-- Bottom Arc (Pink/Purple) -->
  <path d="M 372 292 A 130 130 0 0 1 142 312" fill="none" stroke="url(#neonPink)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="152,342 117,307 162,282" fill="url(#neonPink)" filter="url(#glow)"/>

  <!-- Center Glass Badge -->
  <circle cx="256" cy="256" r="76" fill="#13172b" stroke="url(#neonPurple)" stroke-width="6" filter="url(#glow)"/>

  <!-- Currency Emblem Inside Center ($ & € blend) -->
  <path d="M 256 200 L 256 312" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <path d="M 280 230 C 280 216 232 214 232 236 C 232 260 280 256 280 282 C 280 304 232 304 232 288" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="222" y1="246" x2="252" y2="246" stroke="#00f2fe" stroke-width="6" stroke-linecap="round"/>
  <line x1="222" y1="270" x2="252" y2="270" stroke="#00f2fe" stroke-width="6" stroke-linecap="round"/>
</svg>
