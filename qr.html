<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VibeFX (v1.0.0) - Scan with Android Chrome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090a10;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(22, 27, 44, 0.85);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #fff, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.88rem;
      margin: 0 0 20px 0;
    }
    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.3);
    }
    img {
      display: block;
      width: 260px;
      height: 260px;
    }
    .link-pill {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 18px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 9999px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      word-break: break-all;
    }
    .link-pill:hover {
      background: rgba(99, 102, 241, 0.35);
      color: #fff;
    }
    .instructions {
      margin-top: 18px;
      font-size: 0.78rem;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>VibeFX Currency Converter</h1>
    <p>Scan with your Android phone's camera</p>
    <div class="qr-frame">
      <img src="qr-code.png" alt="Scan to open VibeFX Currency Converter">
    </div>
    <br>
    <a href="https://ethanbonser.github.io/VibeFX-Currency-Converter/" target="_blank" class="link-pill">
      https://ethanbonser.github.io/VibeFX-Currency-Converter/
    </a>
    <div class="instructions">
      1. Open your phone camera or QR scanner.<br>
      2. Tap the link to launch in <strong>Chrome for Android</strong>.<br>
      3. Tap <strong>Install</strong> to add it to your home screen.
    </div>
  </div>
</body>
</html>
